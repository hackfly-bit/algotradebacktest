{% extends "base.html" %}

{% block body %}
<div class="flex min-h-full items-center justify-center p-4">
  <form method="post" class="w-full max-w-sm rounded-[6px] border border-black/10 bg-surface p-4 dark:border-white/10 dark:bg-surface-dark">
    {% csrf_token %}
    {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
    <h1 class="text-sm font-semibold">Higgs</h1>
    <p class="mt-1 text-[12px] text-ink/60 dark:text-ink-dark/55">Masuk untuk membuka cockpit backtest.</p>
    {% if form.non_field_errors %}
    <p class="mt-3 text-sm text-loss">{{ form.non_field_errors.0 }}</p>
    {% endif %}
    <label class="mt-3 block text-[12px] font-medium" for="id_username">Nama pengguna</label>
    <input class="field-input" type="text" name="username" id="id_username" autocomplete="username" required autofocus>
    <label class="mt-3 block text-[12px] font-medium" for="id_password">Kata sandi</label>
    <input class="field-input" type="password" name="password" id="id_password" autocomplete="current-password" required>
    <button type="submit" class="btn-primary mt-4 w-full">Masuk</button>
  </form>
</div>
{% endblock %}
