{% extends "base.html" %}

{% block content %}
<section class="flex flex-col gap-4">
  <div>
    <p class="font-mono text-[12px] text-ink/55 dark:text-ink-dark/50">{{ name }}</p>
    <h2 class="mt-1 text-base font-medium">Logic spec</h2>
    <pre class="mt-2 max-w-3xl whitespace-pre-wrap rounded-[6px] border border-black/10 bg-surface p-3 font-mono text-[12px] leading-relaxed text-ink/85 dark:border-white/10 dark:bg-surface-dark dark:text-ink-dark/80">{{ logic_spec }}</pre>
  </div>

  <div>
    <h2 class="text-sm font-medium">Default params</h2>
    {% if default_params %}
    <div class="mt-2 overflow-x-auto">
      <table class="data-table max-w-xl">
        <thead>
          <tr>
            <th>Key</th>
            <th>Value</th>
          </tr>
        </thead>
        <tbody>
          {% for key, value in default_params %}
          <tr>
            <td class="font-mono text-[12px]">{{ key }}</td>
            <td class="font-mono text-[12px]">{{ value }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    {% else %}
    <p class="mt-1 text-sm text-ink/75 dark:text-ink-dark/75">Tidak ada default params.</p>
    {% endif %}
  </div>
</section>
{% endblock %}
