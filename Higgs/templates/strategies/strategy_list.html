{% extends "base.html" %}

{% block content %}
<section class="flex flex-col gap-3">
  {% if strategies %}
  <div class="overflow-x-auto">
    <table class="data-table">
      <thead>
        <tr>
          <th>Nama</th>
          <th>Logic spec</th>
        </tr>
      </thead>
      <tbody>
        {% for row in strategies %}
        <tr>
          <td class="whitespace-nowrap">
            <a class="text-accent hover:underline dark:text-accent-dark" href="{% url 'strategies:strategy_detail' row.name %}">{{ row.name }}</a>
          </td>
          <td class="max-w-prose text-[12px] text-ink/80 dark:text-ink-dark/75">{{ row.spec_preview }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  {% else %}
  <p class="text-sm text-ink/75 dark:text-ink-dark/75">Belum ada strategy terdaftar.</p>
  {% endif %}
</section>
{% endblock %}
